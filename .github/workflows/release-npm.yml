# Build and publish ONE npm package release, from its release tag.
#
# Tag form: @katsoft/<package>@<version>, for the packages in the tag list below:
# @katsoft/llm-kit-config (packages/llm-kit-config) and @katsoft/llm-kit-send
# (packages/llm-kit-send). The tag holds a "/", and a "*" in
# a GitHub filter pattern never matches "/", so release-packages.yml's '*-v*'
# trigger never matches it (and this trigger never matches a PyPI tag).
#
# Publishing uses npm trusted publishing (OIDC) from environment `npm`, with
# provenance. The job builds from the locked tree (npm ci), runs the tests and
# the tarball check, packs once, and publishes that exact tarball. When the
# version is already on npm (a rerun, or the first release published by hand), it
# publishes nothing. scripts/npm_registry.py waits up to 10 minutes for the
# registry to list the version, checks that the registry's integrity equals the
# packed tarball's integrity, and fails on a mismatch or a timeout, before the
# job records the release.
# Procedure: docs/reference/package-release.md, "npm packages".
name: release-npm
run-name: release ${{ github.ref_name }}

on:
  push:
    tags: ['@katsoft/llm-kit-config@*', '@katsoft/llm-kit-send@*']

concurrency:
  group: release-npm-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Choose the package of the tag
        run: |
          case "$RELEASE_TAG" in
            @katsoft/llm-kit-config@*) name="@katsoft/llm-kit-config"; dir="packages/llm-kit-config" ;;
            @katsoft/llm-kit-send@*) name="@katsoft/llm-kit-send"; dir="packages/llm-kit-send" ;;
            *) echo "tag $RELEASE_TAG names no npm package of this workflow"; exit 1 ;;
          esac
          echo "PACKAGE_NAME=$name" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Check the tag, the version and the npm CLI
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          version="${RELEASE_TAG##*@}"
          test "$RELEASE_TAG" = "$PACKAGE_NAME@$version" || { echo "tag $RELEASE_TAG is not $PACKAGE_NAME@<version>"; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$version" || { echo "package.json version is not $version"; exit 1; }
          test "$(node -p "require('./package.json').name")" = "$PACKAGE_NAME" || { echo "package.json name is not $PACKAGE_NAME"; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('trusted publishing needs npm 11.5.1 or later, found '+process.argv[1]); process.exit(1) }" "$(npm --version)"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
        working-directory: ${{ env.PACKAGE_DIR }}
      - run: npm test
        working-directory: ${{ env.PACKAGE_DIR }}
      - name: Pack, install the tarball in a new directory, run the examples, check the types
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm run check-pack

      - name: Pack the release tarball
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          node scripts/pack-release.mjs "$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - name: Publish once, wait for the registry, compare its integrity with the packed tarball
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          # The registry lists a new version only minutes after a successful publish.
          # The script skips a version that is already listed, treats a 409 as published,
          # waits up to 10 minutes, and fails when the integrity differs.
          python3 ../../scripts/npm_registry.py "$PACKAGE_NAME" "$VERSION" "$TARBALL" "$INTEGRITY" >> "$GITHUB_ENV"

      - name: Record the release in the job summary
        run: |
          {
            echo "### $PACKAGE_NAME@$VERSION"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- result: $MODE"
            echo "- packed integrity: $INTEGRITY"
          } >> "$GITHUB_STEP_SUMMARY"
