name: tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
jobs:
  libraries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run library tests and clean-environment wheel checks
        env:
          WHEEL_CLOSURE_SOURCE: local
        run: uv run --extra dev pytest -q
