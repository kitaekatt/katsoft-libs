# An example project model file (format llm-kit.project-models/v1).
# The endpoint names are placeholders: portable validation does not resolve them.
version: 1
catalog:
  - id: quick
    label: Quick
    endpoint: example-api
    model: example/quick-1
    efforts: [low, high]
    max_output_tokens: 4096
  - id: careful
    label: Careful
    endpoint: example-api
    model: example/careful-2
    traits: [slow]
    request_defaults: {temperature: 0.7}
requests:
  short: {temperature: 0.2, max_output_tokens: 400}
selections:
  summary.write: {model: quick, effort: low, request: short}
  summary.review: {model: careful}
