<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph viewer</title>
<link rel="stylesheet" href="/static/viewer.css">
<link id="theme" rel="stylesheet" href="/theme.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="top">
  <h1>llm-kit graph viewer</h1>
  <span id="project" class="muted"></span>
</header>
<div id="banner" role="alert"></div>
<main class="layout">
  <aside id="side" class="side" aria-label="Graphs and runs"></aside>
  <section class="main" aria-label="Graph">
    <div id="runbar" class="runbar"></div>
    <div id="toolbar" class="toolbar"></div>
    <div id="notice"></div>
    <div id="canvas" class="canvas fit"></div>
  </section>
  <aside id="inspector" class="inspector" aria-label="Node details"></aside>
</main>
<noscript><p class="error-box">This viewer needs JavaScript.</p></noscript>
</body>
</html>
