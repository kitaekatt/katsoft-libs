[project]
name = "yaml-data-editor-kit"
version = "0.19.0"
description = "Project-independent YAML data dialect: schema, anchored comments, and planner/dispatcher binding. Databench owns the browser editor boundary; this package ships no web editor."
requires-python = ">=3.12"

dependencies = [
    "pyyaml",
    "katsoft-llm-kit[config,sdk,pipeline]>=1.1,<2",
    "katsoft-contracts>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["lib"]
